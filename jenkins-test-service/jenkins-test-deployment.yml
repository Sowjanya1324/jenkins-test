apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-test-service
spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins-test-service

  template:
    metadata:
      labels:
        app: jenkins-test-service

    spec:
      containers:
        - name: jenkins-test-service
          image: sowjanya1324/jenkins-test-service:1.0
          ports:
            - containerPort: 8086